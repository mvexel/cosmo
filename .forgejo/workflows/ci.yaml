name: CI

on:
  push:
    branches:
      - main

jobs:
  build:
    runs-on: docker
    container:
      image: rust:latest
    steps:
      - name: Checkout code
        uses: https://github.com/actions/checkout@v4

      - name: Build
        run: cargo build --release --verbose

      - name: Run tests
        run: cargo test --release --verbose
