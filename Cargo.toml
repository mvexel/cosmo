[package]
name = "cosmo"
version = "0.2.0"
edition = "2021"
rust-version = "1.88.0"
description = "Convert OSM PBF files to GeoJSON, GeoJSONL, GeoParquet, CSV, and MapRoulette task formats with declarative YAML and CEL filtering."
license = "ISC"
repository = "https://codeberg.org/mvexel/cosmo"
homepage = "https://codeberg.org/mvexel/cosmo"
documentation = "https://codeberg.org/mvexel/cosmo/src/branch/main/docs/filter_yaml_guide.md"
keywords = ["osm", "openstreetmap", "geojson", "geoparquet", "cli"]
categories = ["command-line-utilities", "science::geo"]
exclude = [".forgejo/**", ".mise.toml", "AGENTS.md", "CLAUDE.md", "docs/worklog.md"]

[dependencies]
anyhow = "1.0.100"
arrow-array = "57.1.0"
arrow-schema = "57.1.0"
clap = { version = "4.5.53", features = ["derive", "env"] }
crossbeam-channel = "0.5.15"
geo = "0.32.0"
geo-types = "0.7.18"
geojson = "0.24.2"
geozero = { version = "0.15.1", features = ["with-geo", "with-wkb", "with-wkt"] }
csv = "1.3"
memmap2 = "0.9.9"
libc = "0.2"
osmpbf = "0.3.8"
parquet = "57.1.0"
rayon = "1.10"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.147"
serde_yaml = "0.9.34"
tempfile = "3.20"
time = { version = "0.3.37", features = ["formatting", "parsing"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
cel = "0.11"
