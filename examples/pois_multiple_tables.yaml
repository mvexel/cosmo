# =============================================================================
# POI (Points of Interest) Configuration - Multiple Tables
# =============================================================================
#
# This configuration extracts named points of interest from OSM data and
# outputs each category as a separate table/layer.
#
# This example demonstrates:
#   - Multiple table definitions (one per category)
#   - Category-specific filtering
#   - CEL expressions for computed values (localized names)
#   - Geometry handling for nodes and building centroids
#
# =============================================================================

tables:
  restaurants:
    filter: "name & (amenity=restaurant|food_court|diner|bbq)"
    geometry:
      node: true
      way: centroid
      closed_way: centroid
      relation: false
    columns:
      - name: name
        source: tag:name
      - name: name_en
        source: "expr:has(tags.name_en) ? tags.name_en : tags.name"
      - name: tags
        source: tags
        type: json
      - name: osm_id
        source: meta:id
        type: integer
      - name: version
        source: meta:version
        type: integer
      - name: timestamp
        source: meta:timestamp

